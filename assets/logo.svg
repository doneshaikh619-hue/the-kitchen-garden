<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E29D"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA820A"/>
      <stop offset="100%" stop-color="#E5C158"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Crest Icon -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield / Circle -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="2, 4" opacity="0.7"/>
    <circle cx="50" cy="50" r="41" fill="#0c1810" stroke="url(#goldGrad)" stroke-width="1.5"/>
    
    <!-- Botanical Leaves Left -->
    <path d="M 50,85 C 38,78 30,64 30,50 C 30,36 38,25 48,20 C 46,27 46,38 49,46 C 45,43 38,44 37,50 C 36,56 44,60 48,64 C 43,65 38,70 41,76 C 44,80 47,82 50,85 Z" fill="url(#goldGrad)" opacity="0.9"/>
    
    <!-- Botanical Leaves Right -->
    <path d="M 50,85 C 62,78 70,64 70,50 C 70,36 62,25 52,20 C 54,27 54,38 51,46 C 55,43 62,44 63,50 C 64,56 56,60 52,64 C 57,65 62,70 59,76 C 56,80 53,82 50,85 Z" fill="url(#goldGrad)" opacity="0.9"/>
    
    <!-- Center Fork & Sprout -->
    <path d="M 50,26 L 50,72 M 45,34 C 45,42 50,44 50,44 C 50,44 55,42 55,34" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Subtle Star -->
    <polygon points="50,14 52,18 56,19 53,22 54,26 50,24 46,26 47,22 44,19 48,18" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(130, 20)">
    <!-- Pretitle -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#a4baa9" text-transform="uppercase">
      THE COUNTRY CLUB · SIALKOT
    </text>
    
    <!-- Main Title -->
    <text x="0" y="58" font-family="'Playfair Display', serif" font-size="34" font-weight="700" letter-spacing="2" fill="url(#goldGrad)" filter="url(#softGlow)">
      THE KITCHEN GARDEN
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="2" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="500" letter-spacing="3" fill="#dfdcd3" opacity="0.9">
      DIAMOND CITY · BOTANICAL DINING &amp; GRILL
    </text>
  </g>
</svg>
